# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and run hardware-free tests
        shell: pwsh
        run: .\tools\build\Build.ps1 -Configuration Release -ManagedOnly
